# 在 GitHub 托管的 macOS 云端编译 iOS 安装包（Windows 本机无法编译 iOS）。
#
# 产物为【未签名】IPA：可直接交给 Sideloadly / AltStore 等工具侧载，
# 或作为 App Store / TestFlight 提交的基线。正式分发需要 Apple 开发者证书签名。
name: Build iOS package

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ios/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/Payload/
          cd build/ios
          zip -qry ../moe_moment-ios-unsigned.ipa Payload
          ls -lh ../moe_moment-ios-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: moe-moment-ios-unsigned
          path: build/moe_moment-ios-unsigned.ipa
          if-no-files-found: error
